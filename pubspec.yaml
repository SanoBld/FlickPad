name: flickpad
description: Unified tracker for movies, series and video games.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Env vars
  flutter_dotenv: ^5.1.0

  # State management
  provider: ^6.1.2

  # Theming
  dynamic_color: ^1.7.0

  # UI helpers
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  youtube_player_flutter: ^9.0.3
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
